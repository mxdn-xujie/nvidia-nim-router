<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - NVIDIA NIM Router</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="dark">
<div class="layout">
  <aside class="sidebar">
    <div class="logo"><div class="mark">N</div><div>NIM Router</div></div>
    <nav>
      <a href="/"><span class="icon">◉</span>首页</a>
      <a href="/upstream.html"><span class="icon">▲</span>上游管理</a>
      <a href="/downstream.html"><span class="icon">▼</span>下游管理</a>
      <a href="/settings.html" class="active"><span class="icon">⚙</span>设置</a>
    </nav>
    <div class="version">v1.0.0</div>
  </aside>
  <main class="main">
    <div class="page-title">设置</div>
    <div class="page-sub">故障转移与调度参数、后台安全、外观</div>

    <div class="panel">
      <h3>故障转移</h3>
      <label class="field">
        <span class="name">超时转移时间（timeout_ms）：<b id="lbl-timeout">30000</b> ms</span>
        <input type="range" id="inp-timeout" min="1000" max="120000" step="1000" value="30000">
        <div class="hint">上游请求超过该时间未响应即判定超时并切换 Key（1000–120000 ms）</div>
      </label>
      <label class="field">
        <span class="name">重试次数（max_retries）</span>
        <input type="number" id="inp-retries" min="1" max="5" value="3" style="width:120px">
        <div class="hint">故障转移最大重试次数（1–5），耗尽后把最后一次上游响应原样返回</div>
      </label>
      <label class="field">
        <span class="name">冷却时间（cooldown_seconds）</span>
        <input type="number" id="inp-cooldown" min="10" max="600" value="60" style="width:120px">
        <div class="hint">429 / 超时后 Key 的冷却时长（10–600 秒）</div>
      </label>
      <label class="field">
        <span class="name">自动流式（auto_stream）</span>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="chk-auto-stream" checked>
          非流式请求自动转为流式上游并在服务端聚合回包
        </label>
        <div class="hint">开启后下游无需配置 stream=true：路由对上游强制流式，规避大模型长响应读超时；响应仍是完整 JSON，下游无感知</div>
      </label>
      <label class="field">
        <span class="name">批量检测速率（check_rate_per_minute）：<b id="lbl-rate-hint">6</b></span>
        <input type="range" id="inp-check-rate" min="1" max="10" step="1" value="6">
        <div class="hint">「全部检测」的限速：每分钟检测 1-10 个 Key，两次请求间隔 60/速率 秒（速率 6 = 每 10 秒一个），避免批量检测触发上游限流</div>
      </label>
    </div>

    <div class="panel">
      <h3>调度策略</h3>
      <label class="field">
        <span class="name">策略</span>
        <select id="sel-strategy" style="width:220px">
          <option value="round_robin">轮巡（round_robin）</option>
          <option value="random">随机（random）</option>
          <option value="sequential">顺序（sequential）</option>
        </select>
      </label>
      <label class="field">
        <span class="name">每 N 次请求切换下一个 Key（switch_every）</span>
        <input type="number" id="inp-switch" min="1" max="1000" value="3" style="width:120px">
        <div class="hint">随机策略下该项无效</div>
      </label>
    </div>

    <div class="panel">
      <h3>安全</h3>
      <label class="field">
        <span class="name">管理密码（admin_password）</span>
        <input type="password" id="inp-admin-password" placeholder="留空 = 不启用后台鉴权" style="width:320px">
        <div class="hint" id="hint-admin"></div>
      </label>
    </div>

    <div class="panel">
      <h3>外观与高级</h3>
      <label class="field">
        <span class="name">主题</span>
        <select id="sel-theme" style="width:160px">
          <option value="dark">深色（dark）</option>
          <option value="light">浅色（light）</option>
        </select>
      </label>
      <label class="field">
        <span class="name">NVIDIA Base URL（默认锁定）</span>
        <div style="display:flex;gap:10px;align-items:center;">
          <input type="url" id="inp-base-url" value="https://integrate.api.nvidia.com/v1" disabled style="flex:1;max-width:420px">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;">
            <input type="checkbox" id="chk-unlock"> 解锁修改
          </label>
        </div>
        <div class="hint">兼容私有 NIM 部署；修改前请确认地址以 /v1 结尾</div>
      </label>
    </div>

    <button class="btn primary" id="btn-save" style="padding:10px 32px;">保存设置</button>
  </main>
</div>

<button class="theme-toggle" id="theme-btn" title="切换主题">🌙</button>
<script src="/assets/app.js"></script>
<script>
  function fill(s) {
    document.getElementById('inp-timeout').value = s.timeout_ms;
    document.getElementById('lbl-timeout').textContent = s.timeout_ms;
    document.getElementById('inp-retries').value = s.max_retries;
    document.getElementById('inp-cooldown').value = s.cooldown_seconds;
    document.getElementById('sel-strategy').value = s.strategy;
    document.getElementById('inp-switch').value = s.switch_every;
    document.getElementById('sel-theme').value = s.theme;
    document.getElementById('inp-base-url').value = s.nvidia_base_url;
    document.getElementById('chk-auto-stream').checked = !!s.auto_stream;
    document.getElementById('inp-check-rate').value = s.check_rate_per_minute;
    document.getElementById('lbl-rate-hint').textContent =
      s.check_rate_per_minute + ' 次/分钟（间隔 ' + (60 / s.check_rate_per_minute).toFixed(1) + ' 秒）';
    document.getElementById('hint-admin').textContent =
      s.admin_password_set ? '当前已启用密码保护；留空保存将关闭鉴权' : '当前未启用鉴权；设置密码后管理 API 需 Bearer 携带';
    document.getElementById('inp-switch').disabled = (s.strategy === 'random');
  }

  document.getElementById('inp-timeout').addEventListener('input', (e) => {
    document.getElementById('lbl-timeout').textContent = e.target.value;
  });

  document.getElementById('inp-check-rate').addEventListener('input', (e) => {
    const v = parseInt(e.target.value, 10) || 6;
    document.getElementById('lbl-rate-hint').textContent =
      v + ' 次/分钟（间隔 ' + (60 / v).toFixed(1) + ' 秒）';
  });

  // 主题即时预览
  document.getElementById('sel-theme').addEventListener('change', (e) => {
    App.applyTheme(e.target.value);
    document.getElementById('theme-btn').textContent = e.target.value === 'light' ? '☀' : '🌙';
  });

  document.getElementById('sel-strategy').addEventListener('change', (e) => {
    document.getElementById('inp-switch').disabled = (e.target.value === 'random');
  });

  document.getElementById('chk-unlock').addEventListener('change', (e) => {
    document.getElementById('inp-base-url').disabled = !e.target.checked;
  });

  document.getElementById('btn-save').addEventListener('click', async () => {
    const body = {
      timeout_ms: parseInt(document.getElementById('inp-timeout').value, 10),
      max_retries: parseInt(document.getElementById('inp-retries').value, 10) || 3,
      cooldown_seconds: parseInt(document.getElementById('inp-cooldown').value, 10) || 60,
      strategy: document.getElementById('sel-strategy').value,
      switch_every: parseInt(document.getElementById('inp-switch').value, 10) || 3,
      theme: document.getElementById('sel-theme').value,
      admin_password: document.getElementById('inp-admin-password').value,
      auto_stream: document.getElementById('chk-auto-stream').checked,
      check_rate_per_minute: parseInt(document.getElementById('inp-check-rate').value, 10) || 6,
    };
    if (document.getElementById('chk-unlock').checked) {
      body.nvidia_base_url = document.getElementById('inp-base-url').value.trim();
    }
    try {
      const s = await App.api('/api/settings', { method: 'PUT', body: JSON.stringify(body) });
      fill(s);
      document.getElementById('inp-admin-password').value = '';
      App.toast('设置已保存');
    } catch (e) { App.toast(e.message, 'error'); }
  });

  document.getElementById('theme-btn').addEventListener('click', () => {
    const t = App.toggleTheme();
    document.getElementById('theme-btn').textContent = t === 'light' ? '☀' : '🌙';
    document.getElementById('sel-theme').value = t;
  });

  App.api('/api/settings').then(fill).catch((e) => App.toast(e.message, 'error'));
</script>
</body>
</html>
