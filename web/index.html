<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 - NVIDIA NIM Router</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="dark">
<div class="layout">
  <aside class="sidebar">
    <div class="logo"><div class="mark">N</div><div>NIM Router</div></div>
    <nav>
      <a href="/" class="active"><span class="icon">◉</span>首页</a>
      <a href="/upstream.html"><span class="icon">▲</span>上游管理</a>
      <a href="/downstream.html"><span class="icon">▼</span>下游管理</a>
      <a href="/settings.html"><span class="icon">⚙</span>设置</a>
    </nav>
    <div class="version">v1.0.0</div>
  </aside>
  <main class="main">
    <div class="page-title">实时监控</div>
    <div class="page-sub">当前路由服务的请求与 Token 概览（数据每秒刷新）</div>

    <div class="warn-banner" id="warn-banner">⚠ 可用上游数为 0：所有上游 Key 均不可用，代理请求将返回 503。</div>

    <div class="cards">
      <div class="stat-card">
        <div class="label">实时请求数（RPM）</div>
        <div class="value" id="v-rpm">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Token 速度</div>
        <div class="value" id="v-tps">0</div>
      </div>
      <div class="stat-card">
        <div class="label">总 Token</div>
        <div class="value" id="v-tokens">0</div>
      </div>
      <div class="stat-card">
        <div class="label">总运行时长</div>
        <div class="value plain" id="v-uptime">0天 00:00:00</div>
      </div>
    </div>

    <div class="panel chart-panel">
      <h3>最近 1 小时请求数（每分钟 1 点）</h3>
      <svg id="chart" viewBox="0 0 800 220" preserveAspectRatio="none">
        <g id="chart-grid"></g>
        <path id="chart-area" fill="rgba(118,185,0,0.12)" d=""></path>
        <path id="chart-line" fill="none" stroke="#76B900" stroke-width="2" d=""></path>
      </svg>
      <div class="chart-legend">
        <div class="li"><span class="sw"></span>每分钟请求数</div>
        <div class="li" id="chart-max">峰值 0</div>
        <div class="li" id="chart-last">最近 1 分钟 0</div>
      </div>
    </div>

    <div class="cards">
      <div class="stat-card">
        <div class="label">可用上游 / 总上游</div>
        <div class="value plain" id="v-upstreams">0 / 0</div>
      </div>
      <div class="stat-card">
        <div class="label">累计总请求</div>
        <div class="value plain" id="v-requests">0</div>
      </div>
    </div>
  </main>
</div>

<button class="theme-toggle" id="theme-btn" title="切换主题">🌙</button>
<script src="/assets/app.js"></script>
<script>
  let lastChartDraw = 0;

  function animateValue(el, text) {
    if (el.textContent !== text) el.textContent = text;
  }

  function drawChart(points) {
    const svg = document.getElementById('chart');
    const w = 800, h = 220, padX = 8, padTop = 16, padBottom = 26;
    const grid = document.getElementById('chart-grid');
    const max = Math.max(1, ...points);
    const step = (w - padX * 2) / (points.length - 1);
    const y = (v) => h - padBottom - (v / max) * (h - padTop - padBottom);
    let d = '';
    points.forEach((v, i) => {
      const x = padX + i * step;
      d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y(v).toFixed(1) + ' ';
    });
    document.getElementById('chart-line').setAttribute('d', d);
    document.getElementById('chart-area').setAttribute(
      'd', d + 'L' + (w - padX) + ' ' + (h - padBottom) + ' L' + padX + ' ' + (h - padBottom) + ' Z');
    // 网格线与刻度
    let g = '';
    for (let i = 0; i <= 4; i++) {
      const gy = padTop + ((h - padTop - padBottom) / 4) * i;
      g += '<line x1="' + padX + '" y1="' + gy + '" x2="' + (w - padX) + '" y2="' + gy + '" stroke="rgba(128,128,128,0.15)" stroke-width="1"/>';
      g += '<text x="' + (w - padX - 2) + '" y="' + (gy - 4) + '" fill="rgba(128,128,128,0.6)" font-size="10" text-anchor="end">' + Math.round(max - (max / 4) * i) + '</text>';
    }
    [-59, -30, 0].forEach((off) => {
      const x = padX + (points.length - 1 + off) * step;
      const label = off === 0 ? '现在' : Math.abs(off) + '分前';
      g += '<text x="' + x + '" y="' + (h - 8) + '" fill="rgba(128,128,128,0.6)" font-size="10" text-anchor="middle">' + label + '</text>';
    });
    grid.innerHTML = g;
    document.getElementById('chart-max').textContent = '峰值 ' + max;
    document.getElementById('chart-last').textContent = '最近 1 分钟 ' + points[points.length - 1];
  }

  function onDashboard(data) {
    animateValue(document.getElementById('v-rpm'), String(data.rpm));
    animateValue(document.getElementById('v-tps'), String(data.tokens_per_sec));
    animateValue(document.getElementById('v-tokens'), App.fmtTokens(data.total_tokens));
    animateValue(document.getElementById('v-uptime'), App.fmtDuration(data.uptime_seconds));
    animateValue(document.getElementById('v-upstreams'), data.active_upstreams + ' / ' + data.total_upstreams);
    animateValue(document.getElementById('v-requests'), App.fmtTokens(data.total_requests));
    document.getElementById('warn-banner').classList.toggle('show', data.total_upstreams > 0 && data.active_upstreams === 0);
    // 折线图每 5 秒更新
    const now = Date.now();
    if (now - lastChartDraw >= 5000 && Array.isArray(data.requests_1h)) {
      lastChartDraw = now;
      drawChart(data.requests_1h);
    }
  }

  document.getElementById('theme-btn').addEventListener('click', () => {
    const t = App.toggleTheme();
    document.getElementById('theme-btn').textContent = t === 'light' ? '☀' : '🌙';
  });

  // 初始拉取一次，随后 SSE 每秒推送
  App.api('/api/dashboard').then(onDashboard).catch((e) => App.toast(e.message, 'error'));
  App.connectSSE(onDashboard);
</script>
</body>
</html>
