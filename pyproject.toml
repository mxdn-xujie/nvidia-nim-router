[project]
name = "nvidia-nim-router"
version = "1.0.0"
description = "NVIDIA NIM 多 API Key 负载均衡反向代理（OpenAI 兼容接口）"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008：FastAPI Depends() 写在参数默认值是官方惯用法
ignore = ["B008"]